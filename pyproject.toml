[project]
name = "phil-analyze"
version = "0.1.0"
description = "Analyze philosophical ODT documents and export findings to Obsidian."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7.0",
    "odfdo>=3.6.0",
    "pandas>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "black>=23.0.0",
    "pylint>=3.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
